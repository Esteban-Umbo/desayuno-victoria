<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Desayuno Victoria</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#fff8ef;
padding:15px;
color:#333;
}

.container{
max-width:1100px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#e85d04,#ff9f1c);
padding:30px;
border-radius:25px;
color:white;
text-align:center;
margin-bottom:20px;
box-shadow:0 6px 20px rgba(0,0,0,0.15);
}

.header h1{
font-size:40px;
margin-bottom:10px;
}

.header p{
font-size:18px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.titulo{
font-size:26px;
margin-bottom:15px;
color:#e85d04;
font-weight:bold;
}

input{
width:100%;
padding:15px;
border-radius:12px;
border:2px solid #eee;
font-size:16px;
margin-top:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.item{
background:#fff3cd;
padding:15px;
border-radius:18px;
display:flex;
flex-direction:column;
justify-content:space-between;
gap:15px;
border:1px solid #ffe69c;
transition:0.2s;
}

.item:hover{
transform:translateY(-3px);
}

.nombre{
font-weight:bold;
font-size:18px;
}

.precio{
color:#d62828;
font-weight:bold;
font-size:18px;
}

.controls{
display:flex;
justify-content:space-between;
align-items:center;
}

button{
border:none;
cursor:pointer;
}

.btn{
background:#2a9d8f;
color:white;
width:40px;
height:40px;
border-radius:10px;
font-size:22px;
}

.contador{
font-size:22px;
font-weight:bold;
}

.total-box{
position:sticky;
bottom:10px;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 6px 20px rgba(0,0,0,0.15);
display:flex;
justify-content:space-between;
align-items:center;
margin-top:20px;
gap:20px;
}

.total{
font-size:34px;
font-weight:bold;
color:#d62828;
}

.enviar{
background:#e85d04;
color:white;
padding:16px 24px;
border-radius:15px;
font-size:18px;
font-weight:bold;
}

.enviar:hover{
background:#d35400;
}

@media(max-width:700px){
.header h1{
font-size:30px;
}

.total-box{
flex-direction:column;
align-items:stretch;
}

.enviar{
width:100%;
}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🍽️ Desayuno Victoria</h1>
<p>Pedidos rápidos y deliciosos</p>
</div>

<div class="card">
<div class="titulo">👤 Nombre del cliente</div>
<input id="nombre" placeholder="Ingresa tu nombre">
</div>

<div class="card">
<div class="titulo">🥪 Panes (S/1.50)</div>
<div class="grid" id="panes"></div>
</div>

<div class="card">
<div class="titulo">☕ Bebidas</div>
<div class="grid" id="bebidas"></div>
</div>

<div class="total-box">
<div>
<div>Total del pedido</div>
<div class="total" id="total">S/0.00</div>
</div>

<button class="enviar" id="btnEnviar" onclick="enviar()">
Confirmar Pedido ✅
</button>
</div>

</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbxqZhTuE30H7JlxlwoDma1v4Sh8qxpjWcyprsSsUSSuphFslPi5S6RQhti1cIy35Rgd/exec";

const panes = [
"Pan con Pollo",
"Pan con Queso",
"Pan con Palta",
"Pan con Torreja de Verdura",
"Pan con Tortilla de Hotdog",
"Pan Lomo",
"Pan Jamón Queso",
"Pan Aceituna",
"Pan Hotdog Papa",
"Pan Pescado",
"Pan Arrebosado",
"Pan Hamburguesa",
"Pan Atún",
"Pan Camote",
"Pan Huevo"
];

const bebidas = [
{n:"Quinua",p:1.5},
{n:"Maca",p:1.5},
{n:"Ponche",p:1.5},
{n:"Avena",p:1.5},
{n:"Café",p:1.5},
{n:"Muña",p:1.5},
{n:"Manzanilla",p:1.5},
{n:"Anís",p:1.5},
{n:"Papaya",p:2}
];

const precioPan = 1.5;

const divP = document.getElementById("panes");
const divB = document.getElementById("bebidas");

panes.forEach((p,i)=>{
divP.innerHTML += `
<div class="item">
<div class="nombre">${p}</div>
<div class="precio">S/1.50</div>
<div class="controls">
<button class="btn" onclick="cambiarPan(${i},-1)">−</button>
<span class="contador" id="pan${i}">0</span>
<button class="btn" onclick="cambiarPan(${i},1)">+</button>
</div>
</div>
`;
});

bebidas.forEach((b,i)=>{
divB.innerHTML += `
<div class="item">
<div class="nombre">${b.n}</div>
<div class="precio">S/${b.p.toFixed(2)}</div>
<div class="controls">
<button class="btn" onclick="cambiarBebida(${i},-1)">−</button>
<span class="contador" id="bebida${i}">0</span>
<button class="btn" onclick="cambiarBebida(${i},1)">+</button>
</div>
</div>
`;
});

let cantidadesPan = new Array(panes.length).fill(0);
let cantidadesBebida = new Array(bebidas.length).fill(0);
let bloqueado = false;

function cambiarPan(i,valor){
cantidadesPan[i] = Math.max(0,cantidadesPan[i] + valor);
document.getElementById("pan" + i).innerText = cantidadesPan[i];
calc();
}

function cambiarBebida(i,valor){
cantidadesBebida[i] = Math.max(0,cantidadesBebida[i] + valor);
document.getElementById("bebida" + i).innerText = cantidadesBebida[i];
calc();
}

function calc(){
let total = 0;

cantidadesPan.forEach(c=>{
total += c * precioPan;
});

cantidadesBebida.forEach((c,i)=>{
total += c * bebidas[i].p;
});

document.getElementById("total").innerText = "S/" + total.toFixed(2);
}

async function enviar(){
if(bloqueado) return;

let nombre = document.getElementById("nombre").value.trim();

if(!nombre){
alert("Ingresa tu nombre");
return;
}

let p = [];
let b = [];

cantidadesPan.forEach((cantidad,i)=>{
if(cantidad > 0){
p.push({
nombre: panes[i],
cantidad: cantidad
});
}
});

cantidadesBebida.forEach((cantidad,i)=>{
if(cantidad > 0){
b.push({
nombre: bebidas[i].n,
cantidad: cantidad
});
}
});

if(p.length === 0 && b.length === 0){
alert("Selecciona al menos un producto");
return;
}

bloqueado = true;

let btn = document.getElementById("btnEnviar");
btn.innerText = "Enviando...";

let tipoPan = "Tradicional";
let total = document.getElementById("total").innerText;

try{
const response = await fetch(URL,{
method:"POST",
body: JSON.stringify({
nombre,
panes:p,
bebidas:b,
tipoPan,
total
})
});

if(response.ok){
btn.innerText = "Pedido enviado ✅";

setTimeout(()=>{
location.reload();
},700);

}else{
throw new Error("Error");
}

}catch(error){
alert("Error al enviar pedido");
btn.innerText = "Confirmar Pedido ✅";
bloqueado = false;
}
}

calc();
</script>

</body>
</html>
