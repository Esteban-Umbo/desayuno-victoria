<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desayuno Victoria</title>

<style>
body{
font-family: Arial;
background:#fff8ef;
margin:0;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h1{
text-align:center;
color:#e85d04;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
background:#fff3cd;
padding:12px;
margin:8px 0;
border-radius:10px;
}

button{
background:#2a9d8f;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#21867a;
}

.total{
font-size:28px;
color:red;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🍽️ Desayuno Victoria</h1>

<h3>Nombre</h3>
<input id="nombre" style="width:100%;padding:10px;">

<h3>Panes (S/1.50 c/u)</h3>
<div id="panes"></div>

<h3>Bebidas</h3>
<div id="bebidas"></div>

<h3>Tipo de pan</h3>
<label>
<input type="radio" name="tipoPan" value="Tradicional" checked>
Tradicional
</label>

<label>
<input type="radio" name="tipoPan" value="Integral (+S/0.30)">
Integral (+S/0.30)
</label>

<h3>Total</h3>
<div class="total" id="total">S/0.00</div>

<br>
<button id="btnEnviar" onclick="enviar()">Confirmar Pedido</button>

</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbxqZhTuE30H7JlxlwoDma1v4Sh8qxpjWcyprsSsUSSuphFslPi5S6RQhti1cIy35Rgd/exec";

/* PANES */
const panes = [
"Pan con Pollo",
"Pan con Queso",
"Pan con Palta",
"Pan Torreja",
"Pan Hot Dog",
"Pan Lomo",
"Pan Jamón Queso",
"Pan Aceituna",
"Pan Hotdog Papa",
"Pan Pescado",
"Pan Arrebosado",
"Pan Hamburguesa",
"Pan Atún",
"Pan Camote",
"Pan Huevo"
];

/* BEBIDAS */
const bebidas = [
{n:"Quinua",p:1.5},
{n:"Maca",p:1.5},
{n:"Ponche",p:1.5},
{n:"Avena",p:1.5},
{n:"Café",p:1.5},
{n:"Muña",p:1.5},
{n:"Manzanilla",p:1.5},
{n:"Anís",p:1.5},
{n:"Papaya",p:2}
];

const precioPan = 1.5;

const divP = document.getElementById("panes");
const divB = document.getElementById("bebidas");

/* RENDER PANES */
panes.forEach((p)=>{
divP.innerHTML += `
<div class="item">
<span>${p}</span>
<div>
<button onclick="cp(this,-1)">-</button>
<span>0</span>
<button onclick="cp(this,1)">+</button>
<input type="hidden" value="0">
</div>
</div>
`;
});

/* RENDER BEBIDAS */
bebidas.forEach((b)=>{
divB.innerHTML += `
<div class="item">
<span>${b.n} - S/${b.p}</span>
<div>
<button onclick="cb(this,-1)">-</button>
<span>0</span>
<button onclick="cb(this,1)">+</button>
<input type="hidden" value="0">
</div>
</div>
`;
});

/* PANES */
function cp(btn,o){
let d = btn.parentElement;
let i = d.querySelector("input");
let s = d.querySelector("span");

i.value = Math.max(0, Number(i.value)+o);
s.innerText = i.value;

calc();
}

/* BEBIDAS */
function cb(btn,o){
let d = btn.parentElement;
let i = d.querySelector("input");
let s = d.querySelector("span");

i.value = Math.max(0, Number(i.value)+o);
s.innerText = i.value;

calc();
}

/* TOTAL */
function calc(){

let total = 0;

/* PANES */
document.querySelectorAll("#panes input").forEach(i=>{
total += Number(i.value) * precioPan;
});

/* BEBIDAS */
document.querySelectorAll("#bebidas input").forEach((i,x)=>{
total += Number(i.value) * bebidas[x].p;
});

/* PAN INTEGRAL */
let tipo = document.querySelector('input[name="tipoPan"]:checked').value;

if(tipo.includes("Integral")){
total += 0.30;
}

document.getElementById("total").innerText =
"S/" + total.toFixed(2);

}

/* RADIO */
document.querySelectorAll('input[name="tipoPan"]').forEach(r=>{
r.addEventListener("change", calc);
});

/* ENVIAR */
let bloqueado = false;

async function enviar(){

if(bloqueado) return;

bloqueado = true;

let btn = document.getElementById("btnEnviar");
btn.innerText = "Enviando...";

let nombre = document.getElementById("nombre").value.trim();

if(!nombre){
alert("Ingresa tu nombre");
btn.innerText = "Confirmar Pedido";
bloqueado = false;
return;
}

let p = [];
let b = [];

/* PANES */
document.querySelectorAll("#panes input").forEach((i,x)=>{
if(Number(i.value) > 0){
p.push({
nombre: panes[x],
cantidad: Number(i.value)
});
}
});

/* BEBIDAS */
document.querySelectorAll("#bebidas input").forEach((i,x)=>{
if(Number(i.value) > 0){
b.push({
nombre: bebidas[x].n,
cantidad: Number(i.value)
});
}
});

let tipoPan = document.querySelector('input[name="tipoPan"]:checked').value;
let total = document.getElementById("total").innerText;

await fetch(URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body: JSON.stringify({
nombre,
panes:p,
bebidas:b,
tipoPan,
total
})
});

btn.innerText = "Pedido enviado";

/* RECARGA AUTOMÁTICA */
setTimeout(()=>{
location.reload();
},1500);

}

calc();

</script>

</body>
</html>
