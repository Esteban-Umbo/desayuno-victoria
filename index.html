<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Desayuno Victoria</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#fff8ef;
padding:15px;
color:#333;
}

.container{
max-width:1100px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#e85d04,#ff9f1c);
padding:30px;
border-radius:25px;
color:white;
text-align:center;
margin-bottom:20px;
box-shadow:0 6px 20px rgba(0,0,0,0.15);
}

.header h1{
font-size:40px;
margin-bottom:10px;
}

.header p{
font-size:18px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.titulo{
font-size:26px;
margin-bottom:15px;
color:#e85d04;
font-weight:bold;
}

input{
width:100%;
padding:15px;
border-radius:12px;
border:2px solid #eee;
font-size:16px;
margin-top:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.item{
background:#fff3cd;
padding:15px;
border-radius:18px;
display:flex;
flex-direction:column;
justify-content:space-between;
gap:15px;
border:1px solid #ffe69c;
transition:0.2s;
}

.item:hover{
transform:translateY(-3px);
}

.nombre{
font-weight:bold;
font-size:18px;
}

.precio{
color:#d62828;
font-weight:bold;
font-size:18px;
}

.controls{
display:flex;
justify-content:space-between;
align-items:center;
}

button{
border:none;
cursor:pointer;
}

.btn{
background:#2a9d8f;
color:white;
width:40px;
height:40px;
border-radius:10px;
font-size:22px;
}

.contador{
font-size:22px;
font-weight:bold;
}

.total-box{
position:sticky;
bottom:10px;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 6px 20px rgba(0,0,0,0.15);
display:flex;
justify-content:space-between;
align-items:center;
margin-top:20px;
gap:20px;
}

.total{
font-size:34px;
font-weight:bold;
color:#d62828;
}

.enviar{
background:#e85d04;
color:white;
padding:16px 24px;
border-radius:15px;
font-size:18px;
font-weight:bold;
}

.enviar:hover{
background:#d35400;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:999;
justify-content:center;
align-items:center;
padding:15px;
}

.voucher{
background:white;
width:100%;
max-width:430px;
border-radius:20px;
padding:25px;
box-shadow:0 8px 30px rgba(0,0,0,0.25);
text-align:left;
}

.voucher h2{
text-align:center;
color:#e85d04;
margin-bottom:10px;
}

.subtitulo{
text-align:center;
font-size:14px;
margin-bottom:15px;
color:#666;
}

.voucher-contenido{
background:#fff8ef;
padding:15px;
border-radius:15px;
white-space:pre-line;
font-size:15px;
line-height:1.5;
border:1px dashed #e85d04;
}

.voucher-link{
margin-top:15px;
font-size:14px;
word-break:break-all;
}

.voucher-link a{
color:#e85d04;
font-weight:bold;
}

.voucher-botones{
display:flex;
gap:10px;
margin-top:20px;
flex-wrap:wrap;
}

.btn-voucher{
flex:1;
padding:13px;
border-radius:12px;
font-size:15px;
font-weight:bold;
color:white;
}

.btn-descargar{
background:#2a9d8f;
}

.btn-wsp{
background:#25D366;
}

.btn-nuevo{
background:#e85d04;
width:100%;
margin-top:10px;
padding:13px;
border-radius:12px;
font-size:15px;
font-weight:bold;
color:white;
}

@media(max-width:700px){
.header h1{
font-size:30px;
}

.total-box{
flex-direction:column;
align-items:stretch;
}

.enviar{
width:100%;
}

.voucher-botones{
flex-direction:column;
}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🍽️ Desayuno Victoria</h1>
<p>Pedidos rápidos y deliciosos</p>
</div>

<div class="card">
<div class="titulo">👤 Nombre del cliente</div>
<input id="nombre" placeholder="Ingresa tu nombre">
</div>

<div class="card">
<div class="titulo">🥪 Panes (S/1.50)</div>
<div class="grid" id="panes"></div>
</div>

<div class="card">
<div class="titulo">☕ Bebidas</div>
<div class="grid" id="bebidas"></div>
</div>

<div class="total-box">
<div>
<div>Total del pedido</div>
<div class="total" id="total">S/0.00</div>
</div>

<button class="enviar" id="btnEnviar" onclick="enviar()">
Confirmar Pedido ✅
</button>
</div>

</div>

<div class="modal" id="modalVoucher">
<div class="voucher">

<h2>🍽️ Desayuno Victoria</h2>

<div class="subtitulo">
Mini voucher de pedido
</div>

<div class="voucher-contenido" id="voucherTexto"></div>

<div class="voucher-link" id="voucherLink"></div>

<div class="voucher-botones">

<button class="btn-voucher btn-descargar" onclick="descargarVoucher()">
Descargar
</button>

<button class="btn-voucher btn-wsp" onclick="enviarWhatsApp()">
Enviar WhatsApp
</button>

</div>

<button class="btn-nuevo" onclick="location.reload()">
Nuevo pedido
</button>

</div>
</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxqZhTuE30H7JlxlwoDma1v4Sh8qxpjWcyprsSsUSSuphFslPi5S6RQhti1cIy35Rgd/exec";

const panes = [
"Pan con Pollo",
"Pan con Queso",
"Pan con Palta",
"Pan con Torreja de Verdura",
"Pan con Tortilla de Hotdog",
"Pan con Lomo",
"Pan con Jamón Queso",
"Pan con Aceituna",
"Pan con Hotdog Papa",
"Pan con Pescado",
"Pan con Arrebosado",
"Pan con Hamburguesa",
"Pan con Atún",
"Pan con Camote",
"Pan con Huevo"
];

const bebidas = [
{n:"Quinua",p:1.5},
{n:"Maca",p:1.5},
{n:"Ponche",p:1.5},
{n:"Avena",p:1.5},
{n:"Café",p:1.5},
{n:"Muña",p:1.5},
{n:"Manzanilla",p:1.5},
{n:"Anís",p:1.5},
{n:"Papaya",p:2}
];

const precioPan = 1.5;

const divP = document.getElementById("panes");
const divB = document.getElementById("bebidas");

let cantidadesPan = new Array(panes.length).fill(0);
let cantidadesBebida = new Array(bebidas.length).fill(0);

let bloqueado = false;

let voucherFinal = "";
let voucherDriveLink = "";

panes.forEach((p,i)=>{

divP.innerHTML += `

<div class="item">

<div class="nombre">${p}</div>

<div class="precio">S/1.50</div>

<div class="controls">

<button class="btn" onclick="cambiarPan(${i},-1)">−</button>

<span class="contador" id="pan${i}">0</span>

<button class="btn" onclick="cambiarPan(${i},1)">+</button>

</div>

<input 
id="obsPan${i}" 
placeholder="Con o sin ají, ensalada, cebolla, etc."
>

</div>

`;

});

bebidas.forEach((b,i)=>{

divB.innerHTML += `

<div class="item">

<div class="nombre">${b.n}</div>

<div class="precio">S/${b.p.toFixed(2)}</div>

<div class="controls">

<button class="btn" onclick="cambiarBebida(${i},-1)">−</button>

<span class="contador" id="bebida${i}">0</span>

<button class="btn" onclick="cambiarBebida(${i},1)">+</button>

</div>

</div>

`;

});

function cambiarPan(i,valor){

cantidadesPan[i] = Math.max(0,cantidadesPan[i] + valor);

document.getElementById("pan" + i).innerText = cantidadesPan[i];

calc();

}

function cambiarBebida(i,valor){

cantidadesBebida[i] = Math.max(0,cantidadesBebida[i] + valor);

document.getElementById("bebida" + i).innerText = cantidadesBebida[i];

calc();

}

function calc(){

let total = 0;

cantidadesPan.forEach(c=>{
total += c * precioPan;
});

cantidadesBebida.forEach((c,i)=>{
total += c * bebidas[i].p;
});

document.getElementById("total").innerText =
"S/" + total.toFixed(2);

}

function crearVoucher(nombre, panesPedido, bebidasPedido, total, idPedido, linkVoucher){

let fecha = new Date().toLocaleString("es-PE");

let texto = "";

texto += "============================\n";
texto += "     DESAYUNO VICTORIA\n";
texto += "============================\n\n";

texto += "ID Pedido: " + idPedido + "\n";

texto += "Cliente: " + nombre + "\n";

texto += "Fecha: " + fecha + "\n";

texto += "Estado: Pendiente\n\n";

texto += "PEDIDO:\n\n";

panesPedido.forEach(p=>{

texto += "• " + p.nombre + " x" + p.cantidad + "\n";

if(p.observacion){

texto += "  Obs: " + p.observacion + "\n";

}

texto += "\n";

});

bebidasPedido.forEach(b=>{

texto += "• " + b.nombre + " x" + b.cantidad + "\n\n";

});

texto += "----------------------------\n";

texto += "TOTAL: " + total + "\n";

texto += "----------------------------\n\n";

if(linkVoucher){

texto += "Voucher: " + linkVoucher + "\n\n";

}

texto += "Gracias por tu pedido ✅";

return texto;

}

function mostrarVoucher(texto, linkVoucher){

voucherFinal = texto;

voucherDriveLink = linkVoucher || "";

document.getElementById("voucherTexto").innerText = texto;

if(voucherDriveLink){

document.getElementById("voucherLink").innerHTML = `
Voucher guardado:<br>
<a href="${voucherDriveLink}" target="_blank">
Abrir voucher descargable
</a>
`;

}else{

document.getElementById("voucherLink").innerHTML = "";

}

document.getElementById("modalVoucher").style.display = "flex";

}

function descargarVoucher(){

if(voucherDriveLink){

window.open(voucherDriveLink, "_blank");

return;

}

}

function enviarWhatsApp(){

let mensaje = encodeURIComponent(voucherFinal);

let link = "https://wa.me/?text=" + mensaje;

window.open(link, "_blank");

}

async function enviar(){

if(bloqueado) return;

let nombre = document.getElementById("nombre").value.trim();

if(!nombre){

alert("Ingresa tu nombre");

return;

}

let p = [];
let b = [];

cantidadesPan.forEach((cantidad,i)=>{

if(cantidad > 0){

p.push({
nombre: panes[i],
cantidad: cantidad,
observacion: document.getElementById("obsPan" + i).value.trim()
});

}

});

cantidadesBebida.forEach((cantidad,i)=>{

if(cantidad > 0){

b.push({
nombre: bebidas[i].n,
cantidad: cantidad
});

}

});

if(p.length === 0 && b.length === 0){

alert("Selecciona al menos un producto");

return;

}

bloqueado = true;

let btn = document.getElementById("btnEnviar");

btn.innerText = "Enviando...";

let tipoPan = "Tradicional";

let total = document.getElementById("total").innerText;

try{

const response = await fetch(SCRIPT_URL,{

method:"POST",

body: JSON.stringify({
nombre,
panes:p,
bebidas:b,
tipoPan,
total
})

});

const textoRespuesta = await response.text();

let resultado;

try{

resultado = JSON.parse(textoRespuesta);

}catch(e){

throw new Error(textoRespuesta);

}

if(resultado.status === "OK"){

btn.innerText = "Pedido enviado ✅";

let voucher = crearVoucher(
nombre,
p,
b,
total,
resultado.idPedido,
resultado.voucherUrl
);

mostrarVoucher(voucher, resultado.voucherUrl);

}else{

throw new Error(resultado.message || "Error");

}

}catch(error){

alert("Error al enviar pedido: " + error.message);

btn.innerText = "Confirmar Pedido ✅";

bloqueado = false;

}

}

calc();

</script>

</body>
</html>
