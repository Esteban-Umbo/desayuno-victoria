<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desayuno Victoria</title>

<style>
body{
font-family: Arial;
background:#fff8ef;
margin:0;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h1{
text-align:center;
color:#e85d04;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
background:#fff3cd;
padding:12px;
margin:8px 0;
border-radius:10px;
}

button{
background:#2a9d8f;
color:white;
border:none;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#21867a;
}

.total{
font-size:28px;
color:red;
font-weight:bold;
}

.contador{
margin:0 10px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🍽️ Desayuno Victoria</h1>

<h3>Nombre</h3>
<input id="nombre" style="width:100%;padding:10px;">

<h3>Panes (S/1.50 c/u)</h3>
<div id="panes"></div>

<h3>Bebidas</h3>
<div id="bebidas"></div>

<h3>Tipo de pan</h3>

<label>
<input type="radio" name="tipoPan" value="Tradicional" checked>
Tradicional
</label>

<label>
<input type="radio" name="tipoPan" value="Integral (+S/0.30)">
Integral (+S/0.30)
</label>

<h3>Total</h3>
<div class="total" id="total">S/0.00</div>

<br>

<button id="btnEnviar" onclick="enviar()">
Confirmar Pedido
</button>

</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbxqZhTuE30H7JlxlwoDma1v4Sh8qxpjWcyprsSsUSSuphFslPi5S6RQhti1cIy35Rgd/exec";

const panes = [
"Pan con Pollo",
"Pan con Queso",
"Pan con Palta",
"Pan Torreja",
"Pan Hot Dog",
"Pan Lomo",
"Pan Jamón Queso",
"Pan Aceituna",
"Pan Hotdog Papa",
"Pan Pescado",
"Pan Arrebosado",
"Pan Hamburguesa",
"Pan Atún",
"Pan Camote",
"Pan Huevo"
];

const bebidas = [
{n:"Quinua",p:1.5},
{n:"Maca",p:1.5},
{n:"Ponche",p:1.5},
{n:"Avena",p:1.5},
{n:"Café",p:1.5},
{n:"Muña",p:1.5},
{n:"Manzanilla",p:1.5},
{n:"Anís",p:1.5},
{n:"Papaya",p:2}
];

const precioPan = 1.5;

const divP = document.getElementById("panes");
const divB = document.getElementById("bebidas");

/* CREAR PANES */
panes.forEach((pan,i)=>{
divP.innerHTML += `
<div class="item">
<span>${pan}</span>
<div>
<button type="button" onclick="cambiar('pan',${i},-1)">-</button>
<span class="contador" id="pan${i}">0</span>
<button type="button" onclick="cambiar('pan',${i},1)">+</button>
</div>
</div>
`;
});

/* CREAR BEBIDAS */
bebidas.forEach((bebida,i)=>{
divB.innerHTML += `
<div class="item">
<span>${bebida.n} - S/${bebida.p}</span>
<div>
<button type="button" onclick="cambiar('bebida',${i},-1)">-</button>
<span class="contador" id="bebida${i}">0</span>
<button type="button" onclick="cambiar('bebida',${i},1)">+</button>
</div>
</div>
`;
});

let cantidadesPan = Array(panes.length).fill(0);
let cantidadesBebida = Array(bebidas.length).fill(0);

/* CAMBIAR CANTIDAD */
function cambiar(tipo,index,valor){

if(tipo==="pan"){
cantidadesPan[index] = Math.max(0,cantidadesPan[index]+valor);
document.getElementById("pan"+index).innerText = cantidadesPan[index];
}

if(tipo==="bebida"){
cantidadesBebida[index] = Math.max(0,cantidadesBebida[index]+valor);
document.getElementById("bebida"+index).innerText = cantidadesBebida[index];
}

calc();
}

/* CALCULAR TOTAL */
function calc(){

let total = 0;

cantidadesPan.forEach(c=>{
total += c * precioPan;
});

cantidadesBebida.forEach((c,i)=>{
total += c * bebidas[i].p;
});

let tipoPan = document.querySelector('input[name="tipoPan"]:checked').value;

if(tipoPan.includes("Integral")){
total += 0.30;
}

document.getElementById("total").innerText =
"S/" + total.toFixed(2);
}

/* CAMBIO RADIO */
document.querySelectorAll('input[name="tipoPan"]').forEach(r=>{
r.addEventListener("change",calc);
});

let bloqueado = false;

/* ENVIAR */
async function enviar(){

if(bloqueado) return;

let nombre = document.getElementById("nombre").value.trim();

if(nombre===""){
alert("Ingresa tu nombre");
return;
}

let pedidoPanes = [];
let pedidoBebidas = [];

cantidadesPan.forEach((c,i)=>{
if(c>0){
pedidoPanes.push({
nombre: panes[i],
cantidad: c
});
}
});

cantidadesBebida.forEach((c,i)=>{
if(c>0){
pedidoBebidas.push({
nombre: bebidas[i].n,
cantidad: c
});
}
});

if(pedidoPanes.length===0 && pedidoBebidas.length===0){
alert("Selecciona al menos un producto");
return;
}

bloqueado = true;

let btn = document.getElementById("btnEnviar");
btn.innerText = "Enviando...";

let tipoPan = document.querySelector('input[name="tipoPan"]:checked').value;
let total = document.getElementById("total").innerText;

try{

await fetch(URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
nombre,
panes:pedidoPanes,
bebidas:pedidoBebidas,
tipoPan,
total
})
});

btn.innerText = "Pedido enviado ✅";

setTimeout(()=>{
location.reload();
},700);

}catch(error){

alert("Error al enviar pedido");
btn.innerText="Confirmar Pedido";
bloqueado=false;

}

}

calc();

</script>

</body>
</html>
