<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desayuno Victoria</title>

<style>
body{
font-family: Arial;
background:#fff8ef;
margin:0;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h1{text-align:center;color:#e85d04;}

.item{
display:flex;
justify-content:space-between;
align-items:center;
background:#fff3cd;
padding:12px;
margin:8px 0;
border-radius:10px;
}

button{
background:#2a9d8f;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

button:hover{background:#21867a;}

.total{
font-size:28px;
color:red;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🍽️ Desayuno Victoria</h1>

<h3>Nombre</h3>
<input id="nombre" style="width:100%;padding:10px;">

<h3>Panes</h3>
<div id="panes"></div>

<h3>Bebidas</h3>
<div id="bebidas"></div>

<h3>Tipo de pan</h3>
<label><input type="radio" name="tipoPan" value="0" checked> Tradicional</label>
<label><input type="radio" name="tipoPan" value="0.3"> Integral (+S/0.30)</label>

<h3>Total</h3>
<div class="total" id="total">S/0.00</div>

<br>
<button id="btnEnviar" onclick="enviar()">Confirmar Pedido</button>

</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbz8v_jLCXRueH4rvLII1vBTT5QXjaQ0gLTxiDkcCLIdgpo0WeiEcHQopbPLPYDPb91Y/exec";

/* ================= CATÁLOGO ================= */
const panes = [
"Pan con Pollo","Pan con Queso","Pan con Palta","Pan Torreja","Pan Hot Dog",
"Pan Lomo","Pan Jamón Queso","Pan Aceituna","Pan Hotdog Papa","Pan Pescado",
"Pan Arrebosado","Pan Hamburguesa","Pan Atún","Pan Camote","Pan Huevo"
];

const bebidas = [
{n:"Quinua",p:1.5},
{n:"Maca",p:1.5},
{n:"Ponche",p:1.5},
{n:"Avena",p:1.5},
{n:"Café",p:1.5},
{n:"Muña",p:1.5},
{n:"Manzanilla",p:1.5},
{n:"Anís",p:1.5},
{n:"Papaya",p:2}
];

const precioPan = 1.5;

/* ================= RENDER ================= */
const divP = document.getElementById("panes");
const divB = document.getElementById("bebidas");

panes.forEach((p,i)=>{
divP.innerHTML += `
<div class="item">
<span>${p}</span>
<div>
<button onclick="cp(this,-1)">-</button>
<span>0</span>
<button onclick="cp(this,1)">+</button>
<input type="hidden" value="0">
</div>
</div>`;
});

bebidas.forEach((b,i)=>{
divB.innerHTML += `
<div class="item">
<span>${b.n}</span>
<div>
<button onclick="cb(this,-1)">-</button>
<span>0</span>
<button onclick="cb(this,1)">+</button>
<input type="hidden" value="0">
</div>
</div>`;
});

/* ================= CAMBIOS ================= */
function cp(btn,o){
let d=btn.parentElement;
let i=d.querySelector("input");
let s=d.querySelector("span");
i.value=Math.max(0,parseInt(i.value)+o);
s.innerText=i.value;
calc();
}

function cb(btn,o){
let d=btn.parentElement;
let i=d.querySelector("input");
let s=d.querySelector("span");
i.value=Math.max(0,parseInt(i.value)+o);
s.innerText=i.value;
calc();
}

/* ================= TOTAL (CORREGIDO DEFINITIVO) ================= */
function calc(){

let total = 0;

// panes
document.querySelectorAll("#panes input").forEach(i=>{
total += Number(i.value) * precioPan;
});

// bebidas
document.querySelectorAll("#bebidas input").forEach((i,x)=>{
total += Number(i.value) * bebidas[x].p;
});

// pan integral (SEGURO)
let radios = document.getElementsByName("tipoPan");

for(let i=0;i<radios.length;i++){
if(radios[i].checked){
total += Number(radios[i].value);
break;
}
}

document.getElementById("total").innerText = "S/" + total.toFixed(2);
}

/* ================= EVENTO RADIO ================= */
document.querySelectorAll('input[name="tipoPan"]').forEach(r=>{
r.addEventListener("change", calc);
});

/* ================= ENVÍO ================= */
let bloqueado = false;

async function enviar(){

if(bloqueado) return;
bloqueado = true;

let btn = document.getElementById("btnEnviar");
btn.innerText = "Enviando...";

let nombre = document.getElementById("nombre").value;

if(!nombre){
bloqueado = false;
btn.innerText = "Confirmar Pedido";
return alert("Ingresa nombre");
}

let p = [];
let b = [];

document.querySelectorAll("#panes input").forEach((i,x)=>{
if(i.value > 0){
p.push({nombre:panes[x],cantidad:i.value});
}
});

document.querySelectorAll("#bebidas input").forEach((i,x)=>{
if(i.value > 0){
b.push({nombre:bebidas[x].n,cantidad:i.value});
}
});

let tipo = document.querySelector('input[name="tipoPan"]:checked').value;
let total = document.getElementById("total").innerText;

await fetch(URL,{
method:"POST",
body:JSON.stringify({
nombre,
panes:p,
bebidas:b,
tipoPan:tipo,
total
})
});

btn.innerText = "Pedido enviado";

setTimeout(()=>{

btn.innerText = "Confirmar Pedido";
bloqueado = false;

document.getElementById("nombre").value = "";

document.querySelectorAll("#panes input").forEach(i=>{
i.value = 0;
i.parentElement.querySelector("span").innerText = 0;
});

document.querySelectorAll("#bebidas input").forEach(i=>{
i.value = 0;
i.parentElement.querySelector("span").innerText = 0;
});

document.querySelector('input[name="tipoPan"][value="0"]').checked = true;

calc();

},1500);

}

calc();

</script>

</body>
</html>
